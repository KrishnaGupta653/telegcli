[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "telegcli"
version = "2.1.0"
description = "The most powerful Telegram terminal client — MTProto-native, production-grade"
authors = [{ name = "telegcli contributors" }]
license = { text = "MIT" }
readme = {file = "README.md", content-type = "text/markdown"}
requires-python = ">=3.9"
keywords = ["telegram", "cli", "tui", "mtproto", "terminal"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Communications :: Chat",
]

dependencies = [
    "telethon>=1.34.0",
    "rich>=13.7.0",
    "prompt_toolkit>=3.0.43",
    "aiofiles>=23.0.0",
    "click>=8.1.7",
    "pillow>=10.0.0",
    "python-magic>=0.4.27",
    "pyperclip>=1.8.2",
    "pydantic>=2.5.0",
    "qrcode>=7.4.2",
    "httpx>=0.27.0",
]

[project.urls]
"Homepage" = "https://github.com/KrishnaGupta653/telegcli"
"Bug Tracker" = "https://github.com/KrishnaGupta653/telegcli/issues"
"Changelog" = "https://github.com/KrishnaGupta653/telegcli/releases"

[project.optional-dependencies]
webhook = ["aiohttp>=3.9.0"]
ngrok = ["pyngrok>=5.2.0"]
deploy = ["aiohttp>=3.9.0", "pyngrok>=5.2.0"]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "pytest-mock>=3.12.0",
    "mypy>=1.7.0",
]

[project.scripts]
telegcli = "telegcli.main:main"

[tool.setuptools.packages.find]
where = ["."]  
include = ["telegcli*"]
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.9"
strict = false
ignore_missing_imports = true
